---
apiVersion: v1
kind: Service
metadata:
  name: alerts-collector
  labels:
    app: alerts-collector
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: alerts-collector-main-tls
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: alerts-collector
