---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alerts-collector-config
  labels:
    app: alerts-collector
data:
  config.yaml: |
    alertmanagers:
      - static_configs:
          - <REPLACE_THIS_WITH_UPSTREAM_ALERTMMANAGER_ENDPOINT>
        scheme: https
        api_version: v2
        http_config:
          bearer_token_file: /etc/alerts-collector/k8s-token/token
          tls_config:
            insecure_skip_verify: false
            ca_file: /etc/alerts-collector/alertmanager-ca-bundle/service-ca.crt
            server_name: <REPLACE_THIS_WITH_UPSTREAM_ALERTMMANAGER_SVC_FQDN>
            cert_file: /etc/alerts-collector/certs/tls.crt
            key_file: /etc/alerts-collector/certs/tls.key
