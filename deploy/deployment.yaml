---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-collector
  labels:
    app: alerts-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alerts-collector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 100%
  template:
    metadata:
      labels:
        app: alerts-collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: alerts-collector
          image: quay.io/morvencao/alerts-collector:latest
          imagePullPolicy: IfNotPresent
          args:
            - --port=8080
            - --log-level=debug
            # - --tls
            # - --tls-cert=/etc/alerts-collector/certs/tls.crt
            # - --tls-key=/etc/alerts-collector/certs/tls.key
            - --alertmanagers.config-file=/etc/alerts-collector/config.yaml
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            periodSeconds: 10
            initialDelaySeconds: 0
            failureThreshold: 3
            successThreshold: 2
            timeoutSeconds: 1
            httpGet:
              scheme: HTTP
              port: http
              path: /healthz
          livenessProbe:
            periodSeconds: 10
            initialDelaySeconds: 60
            failureThreshold: 6
            timeoutSeconds: 1
            httpGet:
              scheme: HTTP
              port: http
              path: /healthz
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
            limits:
              cpu: 100m
              memory: 300Mi
          volumeMounts:
            - name: alerts-collector-config
              mountPath: /etc/alerts-collector
              readOnly: true
            - name: alertmanager-ca-bundle
              mountPath: /etc/alerts-collector/alertmanager-ca-bundle
              readOnly: true
            - name: alerts-collector-k8s-token
              mountPath: /etc/alerts-collector/k8s-token
              readOnly: true
            - name: alerts-collector-main-tls
              mountPath: /etc/alerts-collector/certs
              readOnly: true
      volumes:
        - name: alerts-collector-config
          configMap:
            name: alerts-collector-config
            defaultMode: 420
        - name: alertmanager-ca-bundle
          configMap:
            defaultMode: 420
            name: alertmanager-ca-bundle
        - name: alerts-collector-k8s-token
          secret:
            defaultMode: 420
            secretName: alerts-collector-k8s-token
        - name: alerts-collector-main-tls
          secret:
            defaultMode: 420
            secretName: alerts-collector-main-tls
